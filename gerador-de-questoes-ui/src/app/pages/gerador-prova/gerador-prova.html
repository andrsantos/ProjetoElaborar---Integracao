<div class="container">

  <header class="dashboard-header" style="margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px;">
    <h1 style="margin: 0;">Geração</h1>
    
    <div class="discipline-tag" *ngIf="!carregandoNomeDisciplina && nomeDisciplinaAtiva">
      <span class="tag-label">Disciplina:</span>
      <span class="tag-value">{{ nomeDisciplinaAtiva }}</span>
    </div>

    <div class="discipline-loading" *ngIf="carregandoNomeDisciplina">
      <span class="spinner-micro"></span> Carregando ambiente...
    </div>
  </header>

  <div class="menu-grid">
    
    <!-- OPÇÃO 1: AUTOMÁTICA (Temporariamente Bloqueada) -->
    <a (click)="bloquearFluxo($event)" class="menu-card auto" style="cursor: pointer;">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8.01" y2="16"></line>
          <line x1="16" y1="16" x2="16.01" y2="16"></line>
        </svg>
      </div>
      <div class="card-content">
        <h2>Geração de Questões</h2>
        <p>Selecione os tópicos e deixe a IA criar questões para você.</p>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <!-- OPÇÃO 2: MANUAL -->
    <!-- Redireciona para a rota da geração manual -->
    <a [routerLink]="['/gerar-prova/escolher-modelo-prova']" class="menu-card manual">
      <div class="icon-container">
        <!-- Ícone de "Lápis/Manual" -->
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </div>
      <div class="card-content">
        <h2>Geração de Prova</h2>
        <p>Gere uma prova automaticamente a partir das suas questões no banco de dados.</p>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

  </div>
</div>
