<nav class="sidebar-container">
  <div class="sidebar-header">
    <h3>Elaborar</h3>
    <span *ngIf="temDisciplinaAtiva">{{ nomeDisciplinaAtiva || 'Carregando...' }}</span>
  </div>

  <ul class="sidebar-nav-list">
    <li *ngFor="let link of linksExibidos">
      <a 
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        (click)="lidarComClique(link, $event)"
        [class.exit-link]="link.isExit">
        
        <i *ngIf="link.icon" [class]="link.icon"></i>
        <span>{{ link.label }}</span>

        <span *ngIf="link.hasNotification" class="notification-dot"></span>
        
      </a>
    </li>
  </ul>

</nav>
