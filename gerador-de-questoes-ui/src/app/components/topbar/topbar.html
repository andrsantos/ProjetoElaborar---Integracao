<header class="topbar-container">
  
  <div class="topbar-left"></div>

  <div class="topbar-actions">
    
    <div class="notification-wrapper" *ngIf="mostrarNotificacoes">
      <button class="btn-icon" (click)="toggleDropdown()" [class.active]="mostrarDropdown">
        <i class="fas fa-bell" [ngClass]="{'ring-animation': temNotificacao}"></i>
        <span class="badge-dot" *ngIf="temNotificacao"></span>
      </button>


      <div class="notification-dropdown" *ngIf="mostrarDropdown">
        <div class="dropdown-header">
          <h4>Notificações Recentes</h4>
          <button class="btn-lido" *ngIf="notificacoes.length > 0" (click)="marcarTodasComoLidas()">
            Marcar lidas
          </button>
        </div>
        
        <div class="dropdown-body">
          
          <div class="empty-notifications" *ngIf="notificacoes.length === 0">
            <p>Tudo tranquilo por aqui! Nenhuma novidade no momento.</p>
          </div>


          <ul class="notification-list" *ngIf="notificacoes.length > 0">
            <li class="notification-item" *ngFor="let aviso of notificacoes" (click)="clicarNotificacao(aviso)">
              
              <div class="noti-icon" [ngClass]="aviso.status === 'ERROR' ? 'bg-red' : 'bg-green'">
                <i class="fas" [ngClass]="aviso.status === 'ERROR' ? 'fa-exclamation-triangle' : 'fa-check-circle'"></i>
              </div>
              
              <div class="noti-content">
                <p class="noti-title">
                  {{ aviso.status === 'ERROR' ? 'Falha no processamento' : 'Processamento concluído' }}
                </p>
                <span class="noti-desc">{{ aviso.nomeOriginal || 'Atualização de Taxonomia' }}</span>
              </div>
            </li>
          </ul>
          

        </div>
      </div>

    </div>

    <div class="divider"></div>

    <div class="user-profile">
      <div class="avatar">
        <i class="fas fa-user-circle"></i>
      </div>
      <div class="user-info">
        <span class="user-name">{{nomeUsuario}}</span>
      </div>
      <button class="btn-logout" (click)="sairDoSistema($event)" title="Sair do sistema">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sair</span>
      </button>

    </div>

  </div>
</header>

<div class="overlay-click" *ngIf="mostrarDropdown" (click)="fecharDropdown()"></div>
