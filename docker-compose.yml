  api-questoes:
    build: ./GeradorDeQuestoes
    container_name: api-ia-educacional
    restart: always
    mem_limit: 1g
    ports:
      - "8082:8080" 
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://187.77.240.149:5436/ia_educacional
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=andreysantos12
      - SPRING_AI_OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPRING_AI_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-questoes:
    build: ./gerador-de-questoes-ui
    container_name: web-ia-educacional
    restart: always
    ports:
      - "82:80" 
    depends_on:
      - api-questoes

volumes:
  pgdata_questoes_teste: 